; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5-paper-s3]
platform = espressif32@6.9.0
board = lolin_s3_pro
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_files =
    papers3-library.png
    web/epub-prepare.js
    web/vendor/fflate.js
extra_scripts = post:scripts/build_bin.py
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
monitor_speed = 115200
lib_deps = 
    m5stack/M5GFX@0.2.35
    https://github.com/fbiego/ESPConfig.git#8900364c7d8536117b08812dd4f1eed2b8930ebc
    h2zero/NimBLE-Arduino@2.5.2
    https://github.com/leethomason/tinyxml2.git#10.0.0
